name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Build .NET Backend Services (All Microservices)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('GymHiveBackend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Discover Projects
        id: discover
        run: |
          echo 'Service projects:'
          find GymHiveBackend -type f -name '*.csproj' -not -name '*Tests.csproj'
          echo 'Test projects:'
          find GymHiveBackend -type f -name '*Tests.csproj'

      - name: Restore & Build Services
        run: |
          set -e
          for proj in $(find GymHiveBackend -type f -name '*.csproj' -not -name '*Tests.csproj'); do \
            echo "==> Restoring $proj"; \
            dotnet restore "$proj"; \
            echo "==> Building $proj"; \
            dotnet build "$proj" -c Release --no-restore; \
          done

      - name: Run Tests (if any)
        if: ${{ hashFiles('GymHiveBackend/**/*Tests.csproj') != '' }}
        run: |
          set -e
          for testproj in $(find GymHiveBackend -type f -name '*Tests.csproj'); do \
            echo "==> Testing $testproj"; \
            dotnet test "$testproj" -c Release --no-build --verbosity normal; \
          done

  frontend:
    name: Build Frontend (Svelte + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GymHiveFrontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: GymHiveFrontend/package-lock.json

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Type & Svelte Check
        run: npm run check
        continue-on-error: true  # Adjust once codebase is clean

      - name: Build
        run: npm run build

  summary:
    name: Build Summary
    needs: [ backend, frontend ]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Outcome
        run: |
          echo "Backend job: ${{ needs.backend.result }}"
          echo "Frontend job: ${{ needs.frontend.result }}"
          if [ "${{ needs.backend.result }}" != 'success' ] || [ "${{ needs.frontend.result }}" != 'success' ]; then
            echo "One or more jobs failed."; exit 1; fi
