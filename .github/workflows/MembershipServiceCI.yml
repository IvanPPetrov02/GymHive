name: Membership Service CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'GymHiveBackend/MembershipService/**'
      - '.github/workflows/MembershipServiceCI.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'GymHiveBackend/MembershipService/**'
      - '.github/workflows/MembershipServiceCI.yml'
  workflow_dispatch:

concurrency:
  group: membership-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test Membership Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GymHiveBackend/MembershipService
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
        continue-on-error: true

      - name: Publish Application
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: membership-service-build
          path: GymHiveBackend/MembershipService/publish/
          retention-days: 7

  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/gymhive-membership-service
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./GymHiveBackend
          file: ./GymHiveBackend/MembershipService/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT }}
          export_default_credentials: true
          export_default_credentials: true

      - name: Set IMAGE
        if: ${{ github.event_name == 'push' }}
        run: |
          echo "IMAGE=${{ secrets.DOCKER_USERNAME }}/gymhive-membership-service:${{ github.sha }}" >> $GITHUB_ENV

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_ZONE }}
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Deploy to GKE
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          K8S_NAMESPACE: gymhive
        run: |
          kubectl -n "$K8S_NAMESPACE" set image deployment/membership-service *="$IMAGE" --record
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/membership-service --timeout=120s
