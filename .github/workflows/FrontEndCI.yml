name: Frontend CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'GymHiveFrontend/**'
      - '.github/workflows/FrontEndCI.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'GymHiveFrontend/**'
      - '.github/workflows/FrontEndCI.yml'
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Build & Test Frontend (Svelte + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GymHiveFrontend
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: GymHiveFrontend/package-lock.json

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Lint Code
        run: npm run lint
        continue-on-error: true

      - name: Type & Svelte Check
        run: npm run check
        continue-on-error: true

      - name: Build Application
        run: npm run build
        
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: GymHiveFrontend/dist
          retention-days: 7

  docker-build-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: frontend
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/gymhive-frontend
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./GymHiveFrontend
          file: ./GymHiveFrontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Set IMAGE
        if: ${{ github.event_name == 'push' }}
        run: |
          echo "IMAGE=${{ secrets.DOCKER_USERNAME }}/gymhive-frontend:${{ github.sha }}" >> $GITHUB_ENV

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ secrets.GKE_CLUSTER }}
          location: ${{ secrets.GKE_ZONE }}
          project_id: ${{ secrets.GCP_PROJECT }}

      - name: Deploy to GKE
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        env:
          K8S_NAMESPACE: gymhive
        run: |
          kubectl -n "$K8S_NAMESPACE" set image deployment/frontend *="$IMAGE" --record
          kubectl -n "$K8S_NAMESPACE" rollout status deployment/frontend --timeout=120s