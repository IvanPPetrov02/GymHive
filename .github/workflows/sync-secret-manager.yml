name: Sync Secret Manager (on push to main)

on:
  push:
    branches: [ main ]

jobs:
  sync-secrets:
    name: Sync Secret Manager secrets
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate authentication method
        run: |
          if [ -z "${{ secrets.GCP_SA_KEY }}" ] && [ -z "${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}" ]; then
            echo "ERROR: neither GCP_SA_KEY nor WORKLOAD_IDENTITY_PROVIDER is configured.\nSet a service account key (GCP_SA_KEY) or configure Workload Identity (WORKLOAD_IDENTITY_PROVIDER + GCP_SERVICE_ACCOUNT)." 1>&2
            exit 1
          fi

      - name: Set up Cloud SDK and authenticate (OIDC)
        if: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER != '' }}
        uses: google-github-actions/setup-gcloud@v1
        with:
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT || 'github-actions-deployer@gymhive-481310.iam.gserviceaccount.com' }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Set up Cloud SDK and authenticate (SA key fallback)
        if: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER == '' }}
        uses: google-github-actions/setup-gcloud@v1
        with:
          service_account_key: ${{ secrets.GCP_SA_KEY }}
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Ensure Secret Manager secrets exist and add versions
        env:
          PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          # Optional: you may set these as repo secrets if you want different values
          # If not set, we'll compose connection strings using the shared mysql root password
          AUTH_DB_CONN: ${{ secrets.AUTH_DB_CONN || '' }}
          NOTIF_DB_CONN: ${{ secrets.NOTIF_DB_CONN || '' }}
          GYM_DB_CONN: ${{ secrets.GYM_DB_CONN || '' }}
          WORKOUT_DB_CONN: ${{ secrets.WORKOUT_DB_CONN || '' }}
          EXTERNAL_SECRETS_GSA: ${{ secrets.EXTERNAL_SECRETS_GSA || 'gymhive-secret-accessor@gymhive-481310.iam.gserviceaccount.com' }}
        run: |
          set -euo pipefail

          # helper
          add_or_version() {
            local name="$1"
            local payload="$2"
            echo "Processing secret: $name"
            if ! gcloud secrets describe "$name" --project="$PROJECT_ID" >/dev/null 2>&1; then
              echo "Creating secret $name"
              gcloud secrets create "$name" --project="$PROJECT_ID" --replication-policy="automatic"
            fi
            echo "$payload" | gcloud secrets versions add "$name" --project="$PROJECT_ID" --data-file=-
            echo "Added new version to $name"
            # grant access to ExternalSecrets GSA
            gcloud secrets add-iam-policy-binding "$name" \
              --project="$PROJECT_ID" \
              --member="serviceAccount:${EXTERNAL_SECRETS_GSA}" \
              --role="roles/secretmanager.secretAccessor" || true
          }

          # Compose connection strings if not supplied
          if [ -z "${AUTH_DB_CONN}" ]; then
            AUTH_DB_CONN="Server=auth-db.${PROJECT_ID}.svc.cluster.local;Uid=gymhive_user;Pwd=${MYSQL_ROOT_PASSWORD};Database=GymHive;Port=3306;"
          fi
          if [ -z "${NOTIF_DB_CONN}" ]; then
            NOTIF_DB_CONN="Server=notifications-db.${PROJECT_ID}.svc.cluster.local;Uid=gymhive_user;Pwd=${MYSQL_ROOT_PASSWORD};Database=GymHiveNotifications;Port=3306;"
          fi
          if [ -z "${GYM_DB_CONN}" ]; then
            GYM_DB_CONN="Server=gym-db.${PROJECT_ID}.svc.cluster.local;Uid=gymhive_user;Pwd=${MYSQL_ROOT_PASSWORD};Database=GymHiveGyms;Port=3306;"
          fi
          if [ -z "${WORKOUT_DB_CONN}" ]; then
            WORKOUT_DB_CONN="Server=workout-db.${PROJECT_ID}.svc.cluster.local;Uid=gymhive_user;Pwd=${MYSQL_ROOT_PASSWORD};Database=GymHiveWorkout;Port=3306;"
          fi

          # Always ensure mysql root secret exists
          add_or_version "mysql-root-password" "${MYSQL_ROOT_PASSWORD}"

          # write DB connection secrets
          add_or_version "auth-db-connection-string" "${AUTH_DB_CONN}"
          add_or_version "notifications-db-connection-string" "${NOTIF_DB_CONN}"
          add_or_version "gym-db-connection-string" "${GYM_DB_CONN}"
          add_or_version "workout-db-connection-string" "${WORKOUT_DB_CONN}"

      - name: Trigger ExternalSecrets refresh
        run: |
          kubectl -n gymhive annotate externalsecret auth-db-connection external-secrets.io/refresh="$(date +%s)" --overwrite || true
          kubectl -n gymhive annotate externalsecret notifications-db-connection external-secrets.io/refresh="$(date +%s)" --overwrite || true
          kubectl -n gymhive annotate externalsecret gym-db-connection external-secrets.io/refresh="$(date +%s)" --overwrite || true
          kubectl -n gymhive annotate externalsecret workout-db-connection external-secrets.io/refresh="$(date +%s)" --overwrite || true

      - name: Done
        run: echo "Secret Manager sync complete"
