name: Master CI Status

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]
  workflow_dispatch:

concurrency:
  group: master-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-changes:
    name: Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      auth-service: ${{ steps.filter.outputs.auth-service }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Changes
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'GymHiveFrontend/**'
            auth-service:
              - 'GymHiveBackend/AuthenticationService/**'

  status-report:
    name: CI Status Report
    runs-on: ubuntu-latest
    needs: detect-changes
    
    steps:
      - name: Report Changes
        run: |
          echo "## 🔍 Changed Components" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.detect-changes.outputs.frontend }}" == "true" ]; then
            echo "✅ **Frontend** - Changes detected, pipeline will run" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ **Frontend** - No changes, pipeline skipped" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.detect-changes.outputs.auth-service }}" == "true" ]; then
            echo "✅ **Authentication Service** - Changes detected, pipeline will run" >> $GITHUB_STEP_SUMMARY
          else
            echo "⏭️ **Authentication Service** - No changes, pipeline skipped" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "View individual pipeline runs in the Actions tab" >> $GITHUB_STEP_SUMMARY

  verify-all:
    name: All Checks Passed
    runs-on: ubuntu-latest
    needs: status-report
    if: always()
    
    steps:
      - name: Check Status
        run: |
          echo "✅ CI Status Check Complete"
          echo "Individual pipelines will run based on detected changes"
