name: Authentication Service CI

on:
  push:
    branches: [ main, dev ]
    paths:
      - 'GymHiveBackend/AuthenticationService/**'
      - '.github/workflows/AuthenticationServiceCI.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'GymHiveBackend/AuthenticationService/**'
      - '.github/workflows/AuthenticationServiceCI.yml'
  workflow_dispatch:

concurrency:
  group: auth-service-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test Authentication Service
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: GymHiveBackend/AuthenticationService
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Build Solution
        run: dotnet build --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage"
        continue-on-error: true

      - name: Publish Application
        run: dotnet publish --configuration Release --no-build --output ./publish

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: authentication-service
          path: GymHiveBackend/AuthenticationService/publish
          retention-days: 7

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./GymHiveBackend/AuthenticationService
          file: ./GymHiveBackend/AuthenticationService/Dockerfile
          push: false
          tags: gymhive/authentication-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
