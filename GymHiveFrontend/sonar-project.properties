# Frontend SonarQube Configuration
sonar.projectKey=gymhive-frontend
sonar.projectName=GymHive Frontend
sonar.projectVersion=1.0

# Source code
sonar.sources=src
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.test.ts,**/*.spec.js,**/*.test.js

# TypeScript/JavaScript settings
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Tests
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts,**/*.spec.js,**/*.test.js

# Encoding
sonar.sourceEncoding=UTF-8
