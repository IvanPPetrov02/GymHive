---
# ConfigMap - Non-sensitive configuration ONLY
# NO PASSWORDS HERE - All secrets come from Google Secret Manager via External Secrets Operator
apiVersion: v1
kind: ConfigMap
metadata:
  name: gymhive-config
  namespace: gymhive
data:
  # Database server names (not passwords!)
  AUTH_DB_SERVER: "auth-db"
  AUTH_DB_PORT: "3306"
  AUTH_DB_NAME: "GymHive"
  AUTH_DB_USER: "root"
  
  GYM_DB_SERVER: "gym-db"
  GYM_DB_PORT: "3306"
  GYM_DB_NAME: "GymHiveGyms"
  GYM_DB_USER: "root"
  
  NOTIFICATIONS_DB_SERVER: "notifications-db"
  NOTIFICATIONS_DB_PORT: "3306"
  NOTIFICATIONS_DB_NAME: "GymHiveNotifications"
  NOTIFICATIONS_DB_USER: "root"
  
  WORKOUT_DB_SERVER: "workout-db"
  WORKOUT_DB_PORT: "3306"
  WORKOUT_DB_NAME: "GymHiveWorkoutLogs"
  WORKOUT_DB_USER: "root"
  
  MONGODB_DATABASE_NAME: "GymHiveMembershipsV2"
  
  # RabbitMQ configuration (not password!)
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"
  RABBITMQ_USERNAME: "gymhive"
  RABBITMQ_VIRTUALHOST: "/"
  RABBITMQ_VHOST: "/"
  
  # JWT configuration (not secret!)
  JWT_ISSUER: "GymHive"
  JWT_AUDIENCE: "GymHive"
  JWT_EXPIRATION_HOURS: "24"
  
  # ASP.NET Core
  ASPNETCORE_ENVIRONMENT: "Production"
  ASPNETCORE_URLS: "http://+:8080"
