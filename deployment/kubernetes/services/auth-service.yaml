---
# Authentication Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: gymhive
  labels:
    app: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: ivanppetrov/gymhive-auth-service:main-17f6936
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: gymhive-config
              key: ASPNETCORE_ENVIRONMENT
        - name: ASPNETCORE_URLS
          valueFrom:
            configMapKeyRef:
              name: gymhive-config
              key: ASPNETCORE_URLS
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: gymhive-auth-connection
              key: CONNECTION_STRING
        - name: JWT__Secret
          valueFrom:
            secretKeyRef:
              name: gymhive-jwt-secret
              key: JWT_SECRET
        - name: JWT__Issuer
          valueFrom:
            configMapKeyRef:
              name: gymhive-config
              key: JWT_ISSUER
        - name: JWT__Audience
          valueFrom:
            configMapKeyRef:
              name: gymhive-config
              key: JWT_AUDIENCE
        - name: JWT__ExpirationHours
          valueFrom:
            configMapKeyRef:
              name: gymhive-config
              key: JWT_EXPIRATION_HOURS
        - name: PASSWORD_PEPPER
          valueFrom:
            secretKeyRef:
              name: gymhive-password-pepper
              key: PASSWORD_PEPPER
        - name: RabbitMQ__HostName
          valueFrom:
            configMapKeyRef:
              name: gymhive-config
              key: RABBITMQ_HOST
        - name: RabbitMQ__Port
          valueFrom:
            configMapKeyRef:
              name: gymhive-config
              key: RABBITMQ_PORT
        - name: RabbitMQ__UserName
          valueFrom:
            configMapKeyRef:
              name: gymhive-config
              key: RABBITMQ_USERNAME
        - name: RabbitMQ__Password
          valueFrom:
            secretKeyRef:
              name: gymhive-rabbitmq-password
              key: RABBITMQ_PASSWORD
        - name: RabbitMQ__VirtualHost
          valueFrom:
            configMapKeyRef:
              name: gymhive-config
              key: RABBITMQ_VHOST
        - name: AppSettings__Token
          valueFrom:
            secretKeyRef:
              name: gymhive-jwt-secret
              key: JWT_SECRET
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
# Authentication Service
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: gymhive
spec:
  selector:
    app: auth-service
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
---
# Horizontal Pod Autoscaler for Auth Service
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-service-hpa
  namespace: gymhive
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-service
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
