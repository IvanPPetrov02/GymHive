---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gym-service
  namespace: gymhive
  labels:
    app: gym-service
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gym-service
  template:
    metadata:
      labels:
        app: gym-service
    spec:
      containers:
      - name: gym-service
        image: ivanppetrov/gymhive-gym-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"

        - name: ConnectionStrings__DefaultConnection
          value: ""
          valueFrom:
            secretKeyRef:
              name: gymhive-gym-connection
              key: CONNECTION_STRING

        - name: RabbitMQ__HostName
          value: ""
          valueFrom:
            configMapKeyRef:
              name: gymhive-config
              key: RABBITMQ_HOST
        - name: RabbitMQ__Port
          value: ""
          valueFrom:
            configMapKeyRef:
              name: gymhive-config
              key: RABBITMQ_PORT
        - name: RabbitMQ__UserName
          value: ""
          valueFrom:
            configMapKeyRef:
              name: gymhive-config
              key: RABBITMQ_USERNAME
        - name: RabbitMQ__Password
          value: ""
          valueFrom:
            secretKeyRef:
              name: gymhive-rabbitmq-password
              key: RABBITMQ_PASSWORD
        - name: RabbitMQ__VirtualHost
          value: ""
          valueFrom:
            configMapKeyRef:
              name: gymhive-config
              key: RABBITMQ_VHOST

        - name: AppSettings__Token
          value: ""
          valueFrom:
            secretKeyRef:
              name: gymhive-jwt-secret
              key: JWT_SECRET

        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: gym-service
  namespace: gymhive
spec:
  selector:
    app: gym-service
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gym-service-hpa
  namespace: gymhive
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gym-service
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
