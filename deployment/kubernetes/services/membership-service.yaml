---
# Membership Service Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: membership-service
  namespace: gymhive
  labels:
    app: membership-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: membership-service
  template:
    metadata:
      labels:
        app: membership-service
    spec:
      containers:
      - name: membership-service
        image: ivanppetrov/gymhive-membership-service:latest
        ports:
        - containerPort: 8080
          name: http
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: "Production"
        - name: ASPNETCORE_URLS
          value: "http://+:8080"
        - name: MongoDB__ConnectionString
          value: "mongodb://root:RootPassword123!@mongodb:27017"
        - name: MongoDB__DatabaseName
          value: "GymHiveMembershipsV2"
        - name: RabbitMQ__HostName
          value: "rabbitmq"
        - name: RabbitMQ__Port
          value: "5672"
        - name: RabbitMQ__UserName
          value: "gymhive"
        - name: RabbitMQ__Password
          value: "GymHive123!"
        - name: RabbitMQ__VirtualHost
          value: "/"
        - name: AppSettings__Token
          value: "YourSuperSecretKeyThatIsAtLeast32CharactersLong!"
        - name: GymService__BaseUrl
          value: "http://gym-service:8080"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
---
# Membership Service
apiVersion: v1
kind: Service
metadata:
  name: membership-service
  namespace: gymhive
spec:
  selector:
    app: membership-service
  ports:
  - port: 8080
    targetPort: 8080
    name: http
  type: ClusterIP
---
# Horizontal Pod Autoscaler for Membership Service
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: membership-service-hpa
  namespace: gymhive
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: membership-service
  minReplicas: 1
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 50
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
