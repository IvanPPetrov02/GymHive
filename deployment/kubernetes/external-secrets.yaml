---
# SecretStore - Connection to Google Secret Manager
# This tells External Secrets Operator how to access Google Secret Manager
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-store
  namespace: gymhive
spec:
  provider:
    gcpsm:
      projectID: "gymhive"
      auth:
        workloadIdentity:
          clusterLocation: europe-west1
          clusterName: gymhive-cluster
          serviceAccountRef:
            name: gymhive-ksa
---
# ExternalSecret - Syncs JWT_SECRET from Google Secret Manager
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jwt-secret
  namespace: gymhive
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: gymhive-jwt-secret
    creationPolicy: Owner
  data:
  - secretKey: JWT_SECRET
    remoteRef:
      key: jwt-secret
---
