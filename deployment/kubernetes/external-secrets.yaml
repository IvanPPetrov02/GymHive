---
# SecretStore - Connection to Google Secret Manager
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: gcp-secret-store
  namespace: gymhive
spec:
  provider:
    gcpsm:
      projectID: "gymhive-481310"
      auth:
        workloadIdentity:
          clusterLocation: europe-west1
          clusterName: gymhive-autopilot
          serviceAccountRef:
            name: external-secrets
---
# ExternalSecret - Syncs JWT_SECRET from Google Secret Manager
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jwt-secret
  namespace: gymhive
spec:
  refreshInterval: 5m
  secretStoreRef:
    name: gcp-secret-store
    kind: SecretStore
  target:
    name: gymhive-jwt-secret
    creationPolicy: Owner
  data:
  - secretKey: JWT_SECRET
    remoteRef:
      key: jwt-secret
---
# ExternalSecret - Syncs PASSWORD_PEPPER from Google Secret Manager
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: password-pepper
  namespace: gymhive
spec:
  refreshInterval: 5m
  secretStoreRef:
