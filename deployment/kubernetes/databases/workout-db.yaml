---
# PersistentVolumeClaim for Workout DB
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: workout-db-pvc
  namespace: gymhive
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
# Workout Database Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workout-db
  namespace: gymhive
  labels:
    app: workout-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workout-db
  template:
    metadata:
      labels:
        app: workout-db
    spec:
      containers:
      - name: mysql
        image: mysql:8.0
        env:
        - name: MYSQL_ROOT_HOST
          value: "%"
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gymhive-mysql-password
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          value: "GymHiveWorkoutLogs"
        - name: MYSQL_USER
          value: "gymhive_user"
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: gymhive-mysql-password
              key: MYSQL_ROOT_PASSWORD
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 3306
          initialDelaySeconds: 10
          periodSeconds: 5
      volumes:
      - name: mysql-data
        persistentVolumeClaim:
          claimName: workout-db-pvc
---
# Workout Database Service
apiVersion: v1
kind: Service
metadata:
  name: workout-db
  namespace: gymhive
spec:
  selector:
    app: workout-db
  ports:
  - port: 3306
    targetPort: 3306
    name: mysql
  clusterIP: None  # Headless service
