# External Secrets Operator - Syncs secrets from Google Secret Manager to Kubernetes
# Install with: kubectl apply -f external-secrets-operator.yaml

apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: external-secrets
  namespace: external-secrets
  annotations:
    iam.gke.io/gcp-service-account: gymhive-gke-sa@gymhive.iam.gserviceaccount.com
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-secrets
  namespace: external-secrets
spec:
  replicas: 1
  selector:
    matchLabels:
      app: external-secrets
  template:
    metadata:
      labels:
        app: external-secrets
    spec:
      serviceAccountName: external-secrets
      containers:
      - name: external-secrets
        image: ghcr.io/external-secrets/external-secrets:v0.9.11
        args:
        - --metrics-addr=:8080
        ports:
        - containerPort: 8080
          name: metrics
        env:
        - name: POLLER_INTERVAL_MILLISECONDS
          value: "300000"  # Sync every 5 minutes
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
