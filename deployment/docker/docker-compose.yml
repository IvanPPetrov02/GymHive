services:
  # RabbitMQ Message Broker
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: gymhive-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-gymhive}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-GymHive123!}
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - gymhive-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MongoDB Database (replaces MySQL databases)
  mongodb:
    image: mongo:7.0
    container_name: gymhive-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-RootPassword123!}
      MONGO_INITDB_DATABASE: ${MONGO_DB_NAME:-gymhive}
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - gymhive-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # MySQL Database for Authentication Service (DEPRECATED - will be removed)
  auth-db:
    image: mysql:8.0
    container_name: gymhive-auth-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${AUTH_DB_ROOT_PASSWORD:-RootPassword123!}
      MYSQL_DATABASE: ${AUTH_DB_NAME:-GymHive}
      MYSQL_USER: ${AUTH_DB_USER:-gymhive_user}
      MYSQL_PASSWORD: ${AUTH_DB_PASSWORD:-GymHive123!}
    ports:
      - "3307:3306"
    volumes:
      - auth-db-data:/var/lib/mysql
    networks:
      - gymhive-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${AUTH_DB_ROOT_PASSWORD:-RootPassword123!}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Authentication Service
  auth-service:
    image: ivanppetrov/gymhive-auth-service:latest
    container_name: gymhive-auth-service
    restart: on-failure:5
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=auth-db;Port=3306;Database=${AUTH_DB_NAME:-GymHive};User=${AUTH_DB_USER:-gymhive_user};Password=${AUTH_DB_PASSWORD:-GymHive123!};"
      JWT__Secret: ${JWT_SECRET:-YourSuperSecretKeyThatIsAtLeast32CharactersLong!}
      JWT__Issuer: ${JWT_ISSUER:-GymHive}
      JWT__Audience: ${JWT_AUDIENCE:-GymHive}
      JWT__ExpirationHours: ${JWT_EXPIRATION_HOURS:-24}
      PASSWORD_PEPPER: ${PASSWORD_PEPPER:-GymPepper}
      RabbitMQ__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMQ__Username: ${RABBITMQ_USER:-gymhive}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-GymHive123!}
    ports:
      - "8080:8080"
    depends_on:
      auth-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - gymhive-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # MySQL Database for Gym Service
  gym-db:
    image: mysql:8.0
    container_name: gymhive-gym-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${GYM_DB_ROOT_PASSWORD:-RootPassword123!}
      MYSQL_DATABASE: ${GYM_DB_NAME:-GymHiveGyms}
      MYSQL_USER: ${GYM_DB_USER:-gymhive_user}
      MYSQL_PASSWORD: ${GYM_DB_PASSWORD:-GymHive123!}
    ports:
      - "3308:3306"
    volumes:
      - gym-db-data:/var/lib/mysql
    networks:
      - gymhive-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${GYM_DB_ROOT_PASSWORD:-RootPassword123!}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Gym Service
  gym-service:
    image: ivanppetrov/gymhive-gym-service:latest
    container_name: gymhive-gym-service
    restart: on-failure:5
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=gym-db;Port=3306;Database=${GYM_DB_NAME:-GymHiveGyms};User=${GYM_DB_USER:-gymhive_user};Password=${GYM_DB_PASSWORD:-GymHive123!};"
      JWT__Secret: ${JWT_SECRET:-YourSuperSecretKeyThatIsAtLeast32CharactersLong!}
      JWT__Issuer: ${JWT_ISSUER:-GymHive}
      JWT__Audience: ${JWT_AUDIENCE:-GymHive}
      RabbitMQ__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMQ__Username: ${RABBITMQ_USER:-gymhive}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-GymHive123!}
    ports:
      - "8081:8080"
    depends_on:
      gym-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - gymhive-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Membership Service
  membership-service:
    image: ivanppetrov/gymhive-membership-service:latest
    container_name: gymhive-membership-service
    restart: on-failure:5
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      MongoDB__ConnectionString: ${MONGODB_CONNECTION_STRING:-mongodb://root:RootPassword123!@mongodb:27017}
      MongoDB__DatabaseName: ${MONGODB_DATABASE_NAME:-GymHiveMembershipsV2}
      JWT__Secret: ${JWT_SECRET:-YourSuperSecretKeyThatIsAtLeast32CharactersLongForJWT}
      JWT__Issuer: ${JWT_ISSUER:-GymHive}
      JWT__Audience: ${JWT_AUDIENCE:-GymHive}
      RabbitMQ__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMQ__Username: ${RABBITMQ_USER:-gymhive}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-GymHive123!}
      GymService__BaseUrl: "http://gym-service:8080"
    ports:
      - "8082:8080"
    depends_on:
      mongodb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      gym-service:
        condition: service_started
    networks:
      - gymhive-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # MySQL Database for Notifications Service
  notifications-db:
    image: mysql:8.0
    container_name: gymhive-notifications-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${NOTIFICATIONS_DB_ROOT_PASSWORD:-RootPassword123!}
      MYSQL_DATABASE: ${NOTIFICATIONS_DB_NAME:-GymHiveNotifications}
      MYSQL_USER: ${NOTIFICATIONS_DB_USER:-gymhive_user}
      MYSQL_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:-GymHive123!}
    ports:
      - "3309:3306"
    volumes:
      - notifications-db-data:/var/lib/mysql
    networks:
      - gymhive-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${NOTIFICATIONS_DB_ROOT_PASSWORD:-RootPassword123!}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Notifications Service
  notifications-service:
    image: ivanppetrov/gymhive-notifications-service:latest
    container_name: gymhive-notifications-service
    restart: on-failure:5
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=notifications-db;Port=3306;Database=${NOTIFICATIONS_DB_NAME:-GymHiveNotifications};User=${NOTIFICATIONS_DB_USER:-gymhive_user};Password=${NOTIFICATIONS_DB_PASSWORD:-GymHive123!};"
      JWT__Secret: ${JWT_SECRET:-YourSuperSecretKeyThatIsAtLeast32CharactersLong!}
      JWT__Issuer: ${JWT_ISSUER:-GymHive}
      JWT__Audience: ${JWT_AUDIENCE:-GymHive}
      RabbitMQ__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMQ__Username: ${RABBITMQ_USER:-gymhive}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-GymHive123!}
    ports:
      - "8083:8080"
    depends_on:
      notifications-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - gymhive-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # MySQL Database for Workout Logging Service
  workout-db:
    image: mysql:8.0
    container_name: gymhive-workout-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${WORKOUT_DB_ROOT_PASSWORD:-RootPassword123!}
      MYSQL_DATABASE: ${WORKOUT_DB_NAME:-GymHiveWorkoutLogs}
      MYSQL_USER: ${WORKOUT_DB_USER:-gymhive_user}
      MYSQL_PASSWORD: ${WORKOUT_DB_PASSWORD:-GymHive123!}
    ports:
      - "3310:3306"
    volumes:
      - workout-db-data:/var/lib/mysql
    networks:
      - gymhive-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${WORKOUT_DB_ROOT_PASSWORD:-RootPassword123!}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Workout Logging Service
  workout-service:
    image: ivanppetrov/gymhive-workout-service:latest
    container_name: gymhive-workout-service
    restart: on-failure:5
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Server=workout-db;Port=3306;Database=${WORKOUT_DB_NAME:-GymHiveWorkoutLogs};User=${WORKOUT_DB_USER:-gymhive_user};Password=${WORKOUT_DB_PASSWORD:-GymHive123!};"
      JWT__Secret: ${JWT_SECRET:-YourSuperSecretKeyThatIsAtLeast32CharactersLong!}
      JWT__Issuer: ${JWT_ISSUER:-GymHive}
      JWT__Audience: ${JWT_AUDIENCE:-GymHive}
      RabbitMQ__Host: ${RABBITMQ_HOST:-rabbitmq}
      RabbitMQ__Username: ${RABBITMQ_USER:-gymhive}
      RabbitMQ__Password: ${RABBITMQ_PASSWORD:-GymHive123!}
    ports:
      - "8084:8080"
    depends_on:
      workout-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - gymhive-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # API Gateway
  api-gateway:
    image: ivanppetrov/gymhive-api-gateway:latest
    container_name: gymhive-api-gateway
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      AuthService__BaseUrl: "http://auth-service:8080"
      ReverseProxy__Clusters__auth-cluster__Destinations__destination1__Address: "http://auth-service:8080"
      ReverseProxy__Clusters__gym-cluster__Destinations__destination1__Address: "http://gym-service:8080"
      ReverseProxy__Clusters__membership-cluster__Destinations__destination1__Address: "http://membership-service:8080"
      ReverseProxy__Clusters__notifications-cluster__Destinations__destination1__Address: "http://notifications-service:8080"
      ReverseProxy__Clusters__workout-cluster__Destinations__destination1__Address: "http://workout-service:8080"
      JWT__Secret: ${JWT_SECRET:-YourSuperSecretKeyThatIsAtLeast32CharactersLong!}
      JWT__Issuer: ${JWT_ISSUER:-GymHive}
      JWT__Audience: ${JWT_AUDIENCE:-GymHive}
    ports:
      - "5000:8080"
    depends_on:
      - auth-service
      - gym-service
      - membership-service
      - notifications-service
      - workout-service
    networks:
      - gymhive-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Frontend
  frontend:
    image: ivanppetrov/gymhive-frontend:latest
    container_name: gymhive-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - api-gateway
    networks:
      - gymhive-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Prometheus - Metrics Collection
  prometheus:
    image: prom/prometheus:latest
    container_name: gymhive-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ../monitoring-docker/prometheus:/etc/prometheus
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - gymhive-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana - Metrics Visualization
  grafana:
    image: grafana/grafana:latest
    container_name: gymhive-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ../monitoring-docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - gymhive-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: gymhive-cadvisor
    ports:
      - "8083:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - gymhive-network
    privileged: true
    devices:
      - /dev/kmsg

networks:
  gymhive-network:
    driver: bridge

volumes:
  rabbitmq-data:
    driver: local
  mongodb-data:
    driver: local
  auth-db-data:
    driver: local
  gym-db-data:
    driver: local
  notifications-db-data:
    driver: local
  workout-db-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
