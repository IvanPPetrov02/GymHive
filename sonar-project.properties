# SonarQube Configuration for GymHive Project

# Project identification
sonar.projectKey=gymhive
sonar.projectName=GymHive
sonar.projectVersion=1.0

# Source code locations
sonar.sources=GymHiveBackend,GymHiveFrontend/src
sonar.exclusions=**/node_modules/**,**/bin/**,**/obj/**,**/dist/**,**/*.spec.ts,**/*.test.ts,**/*.spec.js,**/*.test.js

# Backend (.NET) Configuration
sonar.cs.opencover.reportsPaths=**/coverage.opencover.xml
sonar.cs.vstest.reportsPaths=**/TestResults/*.trx

# Frontend (TypeScript/JavaScript) Configuration
sonar.typescript.lcov.reportPaths=GymHiveFrontend/coverage/lcov.info
sonar.javascript.lcov.reportPaths=GymHiveFrontend/coverage/lcov.info

# Test execution reports
sonar.testExecutionReportPaths=GymHiveFrontend/test-report.xml

# Encoding
sonar.sourceEncoding=UTF-8

# Language-specific settings
sonar.language=cs,ts,js

# Coverage exclusions
sonar.coverage.exclusions=**/*Tests.cs,**/*Test.cs,**/*.test.ts,**/*.spec.ts,**/Program.cs,**/Startup.cs

# Duplication exclusions
sonar.cpd.exclusions=**/*DTO.cs,**/*Entity.cs

# Analysis parameters
sonar.scm.provider=git
sonar.scm.disabled=false

# Quality Gate
sonar.qualitygate.wait=true
